[tool.ruff]
line-length = 120
src = ["./src/*/"]
# vendored third-party packages are not ours to lint; force-exclude also skips them when CI names the files
extend-exclude = ["src/*/libs", "src/*/libraries"]
force-exclude = true

[tool.ruff.lint]
select = [
    "F",
    "E", "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "FA",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "INT",
    "ARG",
    "PTH",
    "TD",
    "ERA",
    "PD",
    "PL",
    "FLY",
    "NPY",
    "RUF",
]
ignore = [
    "D203", "D213", "D406", "D407",
    "G004",  # logging does not have any built-in keyword string interpolation for the message itself, falling back to %s etc. is crap
    "UP015",  # open mode should be clearly stated, explicit is better than implicit
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert, may test private internals, and are no package
"src/*/tests/*" = ["S101", "SLF001", "INP001"]
"tests/*" = ["S101", "SLF001", "INP001"]

[tool.black]
line-length = 120

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "./src/*/"
exclude = [
]
follow_imports = "silent"
