; The driver loads wlmData.dll by its file name so that Windows resolves it from the System32 folder
; (SysWOW64 for 32-bit SweepMe!), where the HighFinesse installer places it. Set an explicit path only if
; you need a specific version. Client and server dll must have the same version stamp apart from the
; 32/64-bit indicator, e.g. [7.32.2.23] works together with [7.64.2.23], but not with [7.32.2.22].

[DLL]
path = wlmData.dll
; path = C:\Program Files\HighFinesse\Wavelength Meter WS6 1234\Projects\64\wlmData.dll
